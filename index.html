<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Componentes - Asunción Escalada</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Inventario de Componentes</h1>
            <p>Colegio Nacional E.M.D. Asunción Escalada - BTI</p>
        </header>

        <div class="main-content">
            <!-- Formulario de Registro -->
            <div class="card">
                <h2>Registrar Componente</h2>
                <form id="componenteForm">
                    <div class="form-group">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" placeholder="Ej. ARD001" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Ej. Arduino Uno R3" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <input type="text" id="categoria" placeholder="Ej. Microcontrolador" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" placeholder="Ej. Elegoo" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="cantidad">Cantidad</label>
                        <input type="number" id="cantidad" placeholder="5" min="0" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado" required>
                            <option value="Disponible">Disponible</option>
                            <option value="En Uso">En Uso</option>
                            <option value="Mantenimiento">Mantenimiento</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" rows="3" placeholder="Detalles adicionales..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Guardar Registro</button>
                </form>
            </div>

            <!-- Tabla de Listado -->
            <div class="card">
                <h2>Lista de Componentes</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Cant.</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaComponentes">
                            <!-- Los datos se cargan dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
